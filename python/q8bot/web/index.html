<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kangyangi Control</title>
<style>
  /* 로봇 AP에는 인터넷이 없다 — 외부 폰트/CDN 금지, 전부 인라인 자급자족. */
  :root {
    color-scheme: dark;
    --bg: #0b0d10;
    --surface: #14171c;
    --surface-2: #1b1f26;
    --line: #262b33;
    --text: #e6e9ee;
    --muted: #8a93a0;
    --accent: #5ac8fa;
    --good: #3ddc97;
    --bad: #ff5c6c;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100vh;
    font-size: 14px; line-height: 1.5;
  }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px; border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .brand { font-weight: 650; letter-spacing: -0.01em; font-size: 15px; }
  .brand small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .live {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--muted); font-size: 12px;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--good); box-shadow: 0 0 0 3px rgba(61, 220, 151, 0.15);
  }
  header .spacer { flex: 1; }
  header a { color: var(--accent); text-decoration: none; font-size: 13px; }
  header a:hover { text-decoration: underline; }

  main { flex: 1; display: flex; gap: 14px; padding: 14px; min-height: 0; }

  #camPane {
    flex: 3; background: #000; border-radius: var(--radius);
    border: 1px solid var(--line); position: relative;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  #camImg { width: 100%; height: 100%; object-fit: contain; display: block; }
  #noSignal {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    color: #4b525c; font-size: 13px; letter-spacing: 0.18em;
    background: repeating-linear-gradient(45deg, #0d0f12 0 12px, #101317 12px 24px);
  }
  #noSignal::before {
    content: ""; width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid #2c323b; border-top-color: #4b525c;
    animation: spin 1.1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #camPane.no-signal #noSignal { display: flex; }
  #camPane.no-signal #camImg { visibility: hidden; }

  #panel {
    flex: 2; min-width: 280px; max-width: 420px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px;
    display: flex; flex-direction: column; gap: 18px; overflow-y: auto;
  }
  .group { display: flex; flex-direction: column; gap: 2px; }
  .group h2 {
    margin: 0 0 8px; font-size: 11px; font-weight: 600;
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.09em;
  }
  .stat-row {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 7px 0; border-bottom: 1px solid var(--line);
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row > span:first-child { color: var(--muted); font-size: 13px; }
  .stat-row > span:last-child {
    color: var(--text); font-variant-numeric: tabular-nums;
    font-size: 13px; text-align: right; word-break: break-word;
  }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .buttons .full { grid-column: 1 / -1; }
  button {
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 9px;
    padding: 11px 14px; cursor: pointer;
    font-size: 13px; font-weight: 550; font-family: inherit;
    transition: background 0.12s, border-color 0.12s, transform 0.06s;
  }
  button:hover { background: #232833; border-color: #333a45; }
  button:active { transform: translateY(1px); }
  #btnTorqueOn.active {
    background: rgba(61, 220, 151, 0.14); border-color: var(--good); color: var(--good);
  }
  #btnTorqueOff.active {
    background: rgba(255, 92, 108, 0.13); border-color: var(--bad); color: var(--bad);
  }
  #btnJump:hover { border-color: var(--accent); color: var(--accent); }

  footer {
    padding: 12px 18px; border-top: 1px solid var(--line);
    background: var(--surface); color: var(--muted); font-size: 12.5px;
  }
  .help {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 6px 22px;
  }
  .help div { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
  .help b { color: #b6bdc8; font-weight: 600; font-size: 11px;
            text-transform: uppercase; letter-spacing: 0.07em; min-width: 58px; }
  kbd {
    background: var(--surface-2); border: 1px solid #333a45;
    border-bottom-width: 2px; border-radius: 5px;
    padding: 1px 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px; color: var(--text);
  }
  .note { margin-top: 8px; font-size: 11.5px; color: #6e7683; }

  @media (max-width: 820px) {
    main { flex-direction: column; }
    #panel { max-width: none; flex: none; }
    #camPane { min-height: 240px; }
  }
</style>
</head>
<body>
<header>
  <span class="brand">강양이 <small>Kangyangi Control</small></span>
  <span class="live"><span class="dot"></span>live</span>
  <span class="spacer"></span>
  <a href="/calib.html">관절 캘리브레이션 →</a>
</header>

<main>
  <div id="camPane">
    <img id="camImg" alt="camera">
    <div id="noSignal">NO SIGNAL</div>
  </div>

  <div id="panel">
    <div class="group">
      <h2>상태</h2>
      <div class="stat-row"><span>Torque</span><span id="statTorque">-</span></div>
      <div class="stat-row"><span>Gait</span><span id="statGait">-</span></div>
      <div class="stat-row"><span>Seq</span><span id="statSeq">-</span></div>
      <div class="stat-row"><span>송신 레이트</span><span id="statRate">-</span></div>
      <div class="stat-row"><span>게임패드</span><span id="gpStatus">-</span></div>
    </div>

    <div class="group">
      <h2>제어</h2>
      <div class="buttons">
        <button id="btnTorqueOn">Torque ON</button>
        <button id="btnTorqueOff">Torque OFF</button>
        <button id="btnJump" class="full">Jump</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="help">
    <div><b>이동</b><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><kbd>Q</kbd>왼쪽 앞<kbd>E</kbd>오른쪽 앞</div>
    <div><b>동작</b><kbd>H</kbd>인사<kbd>P</kbd>손<kbd>G</kbd>보행전환<kbd>J</kbd>점프</div>
    <div><b>기타</b><kbd>R</kbd>리셋<kbd>C</kbd>범위표시</div>
    <div><b>패드</b>왼쪽 스틱 12방향 · Y=인사 A=보행전환 X=점프 LB=리셋</div>
  </div>
  <div class="note">
    키 입력은 페이지에 포커스가 있어야 인식됩니다. 게임패드는 아무 버튼이나 한 번 눌러야 브라우저가 연결을 인식합니다.
  </div>
</footer>
<script>
// 로봇 카메라 IP 조회 후 <img> 소스 설정 (스트리밍은 로봇이 직접 제공, 프록시 없음)
fetch('/config').then(r => r.json()).then(cfg => {
  const img = document.getElementById('camImg');
  const pane = document.getElementById('camPane');
  // <img> MJPEG은 끊겨도 스스로 재연결하지 않는다 — 끊기면 페이지를 새로고침할
  // 때까지 죽어 있었다. 쿼리스트링을 바꿔 캐시를 피하고 새 연결을 강제한다.
  const base = `http://${cfg.robot_ip}/`;
  let stallTimer = null;
  const reconnect = () => {
    clearTimeout(stallTimer);
    img.src = `${base}?t=${Date.now()}`;
    // 연결은 되는데 프레임이 안 오는 경우(로봇 재부팅 직후 등)까지 잡는다.
    stallTimer = setTimeout(reconnect, 8000);
  };
  img.onerror = () => {
    pane.classList.add('no-signal');
    clearTimeout(stallTimer);
    stallTimer = setTimeout(reconnect, 2000);  // 즉시 재시도하면 폭주 — 간격을 둔다
  };
  img.onload = () => {
    pane.classList.remove('no-signal');
    clearTimeout(stallTimer);
  };
  pane.classList.add('no-signal');
  reconnect();
}).catch(() => document.getElementById('camPane').classList.add('no-signal'));

// 키 입력: keydown/keyup 이벤트 기반 + 200ms 하트비트(연결 안전, 서버는 500ms 끊기면 전키 해제)
const pressed = new Set();

// Xbox 컨트롤러(Gamepad API): 축 이벤트가 없어 rAF로 계속 폴링. 서버가 데드존/12방향
// 아날로그 해석을 담당하므로(web_operate.py get_joystick_direction) 여기선 원시값만 전송.
let gpAxes = null;
let gpButtons = [];
function pollGamepad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  const gp = pads[0];
  const status = document.getElementById('gpStatus');
  if (gp) {
    gpAxes = { x: gp.axes[0] || 0, y: gp.axes[1] || 0 };
    gpButtons = [];
    gp.buttons.forEach((b, i) => { if (b.pressed) gpButtons.push(i); });
    status.textContent = 'connected';
  } else {
    gpAxes = null;
    gpButtons = [];
    status.textContent = '-';
  }
  requestAnimationFrame(pollGamepad);
}
requestAnimationFrame(pollGamepad);

function post(path, body) {
  fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  }).catch(() => {});
}

function sendKeys() {
  const body = { keys: Array.from(pressed) };
  if (gpAxes) body.axes = gpAxes;          // 게임패드 미연결 시 생략(하위호환)
  if (gpButtons.length) body.buttons = gpButtons;
  post('/keys', body);
}
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (!pressed.has(k)) { pressed.add(k); sendKeys(); }
});
window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (pressed.delete(k)) sendKeys();
});
window.addEventListener('blur', () => { pressed.clear(); sendKeys(); });
setInterval(sendKeys, 200);

// 상태 SSE
const es = new EventSource('/status');
es.onmessage = ev => {
  const s = JSON.parse(ev.data);
  document.getElementById('statTorque').textContent = s.torque_on ? 'ON' : 'OFF';
  document.getElementById('statGait').textContent = s.gait ?? '-';
  document.getElementById('statSeq').textContent = s.seq;
  document.getElementById('statRate').textContent = `${s.rate_hz} Hz`;
  document.getElementById('btnTorqueOn').classList.toggle('active', s.torque_on);
  document.getElementById('btnTorqueOff').classList.toggle('active', !s.torque_on);
};

function sendCmd(cmd) {
  post('/cmd', { cmd });
}
document.getElementById('btnTorqueOn').onclick = () => sendCmd('torque_on');
document.getElementById('btnTorqueOff').onclick = () => sendCmd('torque_off');
document.getElementById('btnJump').onclick = () => sendCmd('jump');
</script>
</body>
</html>
